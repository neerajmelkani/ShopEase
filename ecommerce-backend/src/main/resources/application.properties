spring.application.name=ecommerce-backend

# MySQL connection. Supply credentials through the process environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development schema management and SQL logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# JWT settings. JWT_SECRET must be Base64-encoded key material of at least 32 bytes.
jwt.secret= ${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Local static frontend origins (override with FRONTEND_ORIGINS for another host/port).
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
